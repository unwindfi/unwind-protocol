[package]
name = "unwind-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# Kept out of the program workspace on purpose, with its own Cargo.lock: the
# test-only dependencies below must never move a version the SBF build
# resolves (see scripts/pin-msrv.sh).
[workspace]

[lib]
path = "src/lib.rs"

[dev-dependencies]
unwind = { path = "../programs/unwind", features = ["no-entrypoint", "devnet"] }
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
litesvm = "0.7.1"
proptest = "1.4"
solana-keypair = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
solana-message = "2.2"
solana-account = "2.2"
solana-transaction-error = "2.2"
bytemuck = "1"
base64 = "0.21"
